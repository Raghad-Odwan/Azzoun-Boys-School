<!-- البرمجية (Script) الخاصة بالتحويل وعرض محتوى القوائم والدروس -->
<script type="text/javascript">
  function loadGradeContent(gradeNumber) {
    // إخفاء كل أقسام المحتوى السابقة
    var sections = document.querySelectorAll('.grade-content-section');
    sections.forEach(function(section) {
      section.style.display = 'none';
    });

    // إظهار قسم محتوى الصف المحدد
    var selectedSection = document.getElementById('grade-' + gradeNumber + '-content');
    if (selectedSection) {
      selectedSection.style.display = 'block';
      selectedSection.scrollIntoView({ behavior: 'smooth' });
    } else {
      console.log("جاري تحميل ألعاب ودروس الصف " + gradeNumber);
    }
  }
</script>
