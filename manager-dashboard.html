<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة ذكور عزون الأساسية - لوحة تحكم الإدارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #001D39;
      --primary: #0A4174;
      --secondary: #49769F;
      --accent-1: #4E8EA2;
      --accent-2: #6EA2B3;
      --light-blue: #7BBDE8;
      --bg-light: #BDD8E9;
      --accent-color: #214bd6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 2rem;
      background-color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 29, 57, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 48px;
      width: 48px;
      object-fit: contain;
    }

    /* Nav Menu */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-menu a {
      position: relative;
      text-decoration: none;
      color: var(--bg-dark);
      font-weight: 500;
      font-size: 1.6rem;
      padding-bottom: 6px;
    }

    .nav-menu a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      width: 0;
      height: 3px;
      border-radius: 3px;
      background-color: var(--light-blue);
      transition: width 0.3s ease;
    }

    .nav-menu a:hover::after,
    .nav-menu a.active::after {
      width: 100%;
    }

    .nav-menu a.active {
      color: var(--primary);
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
    }

    .nav-toggle span {
      width: 26px;
      height: 3px;
      background-color: var(--primary);
      border-radius: 3px;
    }

    /* Main wrapper to push footer down */
    .main-content {
      flex: 1;
      padding: 20px 0;
    }

    /* Auth Banner / Box */
    .auth-container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .auth-container h2 {
      color: var(--primary);
      margin-bottom: 15px;
    }

    /* Dashboard Cards */
    .dashboard-card {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .dashboard-card h2 {
      color: var(--primary);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Tajawal', sans-serif;
    }

    input[type="file"] {
      padding: 7px;
      background: #f8fafc;
      cursor: pointer;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    button[type="submit"], .action-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button[type="submit"]:hover, .action-btn:hover {
      background-color: #052441;
    }

    .hidden {
      display: none !important;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .nav-toggle {
        display: flex;
      }

      .nav-menu {
        position: absolute;
        top: 100%;
        right: 0;
        left: 0;
        background-color: #ffffff;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding: 0;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        box-shadow: 0 10px 15px rgba(0, 29, 57, 0.06);
      }

      .nav-menu.open {
        max-height: 200px;
        padding: 0.5rem 0;
      }

      .nav-menu li {
        width: 100%;
      }

      .nav-menu a {
        display: block;
        padding: 0.9rem 1.5rem;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar Section -->
  <nav class="navbar">
    <div class="logo">
      <img src="logo.png" alt="شعار مدرسة ذكور عزون الأساسية">
      مدرسة ذكور عزون الأساسية - لوحة تحكم الادارة
    </div>

    <button class="nav-toggle" id="navToggle" aria-label="فتح القائمة">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-menu" id="navLinks">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="manager-dashboard.html" class="active">لوحة الإدارة</a></li>
    </ul>
  </nav>

  <div class="main-content">
    <!-- خطوة التحقق من البريد الإلكتروني للمديرة -->
    <div class="auth-container" id="authBox">
      <h2>تسجيل الدخول للوحة الإدارة 🔒</h2>
      <p style="margin-bottom: 20px; color: #555;">الرجاء إدخال البريد الإلكتروني المعتمد لصلاحيات الإدارة:</p>
      <div class="form-group">
        <input type="email" id="managerEmailInput" placeholder="example@gmail.com">
      </div>
      <button class="action-btn" onclick="verifyManager()">تحقق ودخول</button>
    </div>

    <!-- لوحة تحكم الإدارة (تكون مخفية حتى يتم التحقق من الإيميل) -->
    <div class="dashboard-card hidden" id="managerDashboard">
      <h2>إدارة ونشر إعلانات المدرسة 📢</h2>
      <form id="addAnnouncementForm">
        
        <!-- عنوان الإعلان -->
        <div class="form-group">
          <label for="announcementTitle">عنوان الإعلان الرئيسي:</label>
          <input type="text" id="announcementTitle"  required>
        </div>



        <!-- رفع صورة الإعلان -->
        <div class="form-group">
          <label for="announcementImage">صورة الإعلان (اختياري):</label>
          <input type="file" id="announcementImage" accept="image/*">
        </div>

        <!-- نص الإعلان التفصيلي -->
        <div class="form-group">
          <label for="announcementText">نص الإعلان أو التعميم:</label>
          <textarea id="announcementText" placeholder=" تفاصيل الإعلان " required></textarea>
        </div>

        <button type="submit">نشر الإعلان</button>
      </form>
    </div>
  </div>

  <script>
    // تفعيل قائمة الهاتف المحمول
    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });

    // دالة التحقق من إيميل المديرة المسموح له (raghadodwan6@gmail.com)
    function verifyManager() {
      const enteredEmail = document.getElementById('managerEmailInput').value.trim();
      const allowedEmail = "raghadodwan6@gmail.com";

      if (enteredEmail === allowedEmail) {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('managerDashboard').classList.remove('hidden');
        alert('مرحباً بكِ، تم التحقق من صلاحيات الإدارة بنجاح.');
      } else {
        alert('عذراً، البريد الإلكتروني غير مصرح له بالدخول إلى لوحة تحكم الإدارة.');
      }
    }

    // كود إرسال وحفظ الإعلان مع دعم رفع وتحويل الصورة
    document.getElementById('addAnnouncementForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const title = document.getElementById('announcementTitle').value;
      const tag = document.getElementById('announcementTag').value;
      const text = document.getElementById('announcementText').value;
      const imageInput = document.getElementById('announcementImage');
      const date = new Date().toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });

      // وظيفة لقراءة الصورة المرفوعة وتحويلها لتخزينها وعرضها
      const saveAnnouncement = (imageUrl = '') => {
        const newAnnouncement = { title, tag, text, image: imageUrl, date };
        let announcements = JSON.parse(localStorage.getItem('schoolAnnouncements')) || [];
        announcements.unshift(newAnnouncement);
        localStorage.setItem('schoolAnnouncements', JSON.stringify(announcements));

        alert('تم نشر الإعلان بنجاح، وسيظهر الآن مباشرة في قسم إعلانات المدرسة بالصفحة الرئيسية!');
        this.reset();
      };

      if (imageInput.files && imageInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          saveAnnouncement(uploadEvent.target.result);
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        saveAnnouncement('');
      }
    });
  </script>

  <footer style="background-color: #001D39; color: #ffffff; text-align: center; padding: 1.5rem 1rem; margin-top: auto; font-family: 'Tajawal', sans-serif;">
    <p style="font-size: 1.1rem; margin-bottom: 5px;">منصة مدرسة ذكور عزون الأساسية</p>
    <p style="font-size: 0.9rem; color: #BDD8E9;">جميع الحقوق محفوظة &copy; 2026</p>
  </footer>

</body>
</html>
